[package]
name = "bytetap-app"
description = "Настольное приложение bytetap на egui: запись «сырого» обмена анализатора с ЛИС без WebView2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "bytetap_app"
path = "src/lib.rs"

[[bin]]
name = "bytetap"
path = "src/main.rs"

[dependencies]
base64.workspace = true
bytetap-core.workspace = true
chrono.workspace = true
dirs.workspace = true
# Окно без WebView2 (ADR 0003): wgpu (DX12, без GPU — WARP), AccessKit, буфер обмена.
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "clipboard", "default_fonts", "x11", "wayland"] }
# SVG-иконки Lucide растеризует resvg.
egui_extras = { version = "0.37", features = ["svg"] }
# Кодировки ленты (FR-27): Windows-1251, GBK, UTF-8, Latin-1 — таблицы WHATWG, как у
# `TextDecoder` в Vue-версии.
encoding_rs = "0.8"
# Адреса ноутбука для подсказки анализатору: локальный перебор, без запросов в сеть.
if-addrs = "0.15"
os_info.workspace = true
# Системные диалоги выбора папки журналов и файла журнала. На Linux — GTK3, как у
# диалогов Tauri в том же workspace: `gtk3` и `xdg-portal` у rfd несовместимы.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
serde.workspace = true
serde_json.workspace = true
# Сессия записи живёт в своём runtime (один на приложение): окно не ждёт ввод-вывод.
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# Системное окно сообщения о фатальной ошибке и панике (NFR-3), рамка окна: скругление
# и цвет рамки средствами DWM (Windows 11), тень окна без декораций.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
base64.workspace = true
bytetap-core = { workspace = true, features = ["test-hooks"] }
bytetap-testkit.workspace = true
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
tempfile.workspace = true
