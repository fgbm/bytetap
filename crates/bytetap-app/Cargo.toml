[package]
name = "bytetap-app"
description = "Настольное приложение bytetap на egui: запись «сырого» обмена анализатора с ЛИС без WebView2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "bytetap_app"
path = "src/lib.rs"

[[bin]]
name = "bytetap"
path = "src/main.rs"

[dependencies]
base64.workspace = true
bytetap-core.workspace = true
chrono.workspace = true
dirs.workspace = true
# Окно без WebView2 (ADR 0003): wgpu (DX12, без GPU — WARP), AccessKit, буфер обмена.
# `default_fonts` выключена: в exe только IBM Plex, глифы интерфейса проверяет тест
# (`theme::install_fonts`).
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "clipboard", "x11", "wayland"] }
# SVG-иконки Lucide растеризует resvg.
egui_extras = { version = "0.37", features = ["svg"] }
# Кодировки ленты (FR-27): Windows-1251, GBK, UTF-8, Latin-1 — таблицы WHATWG, как у
# `TextDecoder` в Vue-версии.
encoding_rs = "0.8"
# Адреса ноутбука для подсказки анализатору: локальный перебор, без запросов в сеть.
if-addrs = "0.15"
os_info.workspace = true
# Системные диалоги выбора папки журналов и файла журнала. Вариант по умолчанию —
# `xdg-portal` (портал рабочего стола), без GTK3 в зависимостях и в пакетах CI.
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
# Сессия записи живёт в своём runtime (один на приложение): окно не ждёт ввод-вывод.
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# Системное окно сообщения о фатальной ошибке и панике (NFR-3), рамка окна: скругление
# и цвет рамки средствами DWM (Windows 11), тень окна без декораций.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    # Номер сборки ОС без манифеста совместимости: RtlGetVersion из ntdll.
    "Wdk_System_SystemServices",
] }

[build-dependencies]
# Ресурс `bytetap.exe` — иконка и VERSIONINFO (`build.rs`, `assets/bytetap.rc`):
# свойства файла и иконка в проводнике. Компилируется только для Windows MSVC.
embed-resource = "3.0"

[features]
# Тестовые хуки (`hooks.rs`, `probe.rs`, `gpu.rs`) и проба цены кадра: смоуки CI и
# тесты. В релизном exe feature выключена, и кода хуков в нём нет вовсе — ни
# переменных окружения `BYTETAP_TEST_*`, ни их чтения. Хуки ядра (задержка писателя
# журнала, предел остановки) включаются вместе с ней.
test-hooks = ["bytetap-core/test-hooks"]

[dev-dependencies]
base64.workspace = true
bytetap-core = { workspace = true, features = ["test-hooks"] }
# Своя же сборка с хуками — как в ядре: `cargo test` получает их без флагов, а
# `cargo build --release` — без них.
bytetap-app = { path = ".", features = ["test-hooks"] }
bytetap-testkit.workspace = true
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
tempfile.workspace = true
