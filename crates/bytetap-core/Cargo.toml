[package]
name = "bytetap-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ядро захвата bytetap: транспорты, автоответчик и журнал"

[dependencies]
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
os_info.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# Тип тома для предупреждения о сетевой папке журналов (FR-19): `GetDriveTypeW`.
# `GetCommState`/`SetCommState` — чётность mark/space, которой нет в `serialport` (FR-11).
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
# Терминал порта: mark/space (`CMSPAR`, `TCGETS2`) и управляющие линии pty (FR-11, M3-AC11).
libc.workspace = true

[features]
# Тестовый хук писателя журнала: задержка перед `sync_data` (M1-AC14).
# Включается только сборкой тестов этого crate, в обычной сборке его нет.
test-hooks = []

[dev-dependencies]
bytetap-core = { path = ".", features = ["test-hooks"] }
bytetap-testkit.workspace = true
jsonschema.workspace = true
proptest.workspace = true
tempfile.workspace = true
