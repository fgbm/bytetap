[workspace]
resolver = "3"
members = [
    "crates/bytetap-core",
    "crates/bytetap-cli",
    "crates/bytetap-testkit",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
bytetap-core = { path = "crates/bytetap-core" }
bytetap-testkit = { path = "crates/bytetap-testkit" }
clap = { version = "4.6", features = ["derive"] }
