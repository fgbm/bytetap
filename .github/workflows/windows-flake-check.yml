name: Windows flake check

# Временный workflow ревью ветки backlog-flakes: 30 прогонов подряд тестов, которые
# падали на windows-latest (простой окна и порядок Tab). Удаляется перед сдачей.
on:
  push:
    branches: [backlog-flakes]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  repeat:
    name: repeat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Системные пакеты и Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.2
        with:
          shared-key: rust-${{ runner.os }}

      - name: Собрать тесты приложения
        run: cargo test -p bytetap-app --test performance --test journal --no-run

      - name: 30 прогонов теста простоя
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "::group::простой, прогон $i"
            cargo test -p bytetap-app --test performance an_idle_window_asks_for_no_frames -- --exact --nocapture
            echo "::endgroup::"
          done

      - name: 30 прогонов порядка Tab в журнале
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "::group::Tab, прогон $i"
            cargo test -p bytetap-app --test journal the_journal_screen_names_its_widgets_and_tabs_in_order -- --exact --nocapture
            echo "::endgroup::"
          done
