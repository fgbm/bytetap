name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cache-key: rust-ubuntu
          - os: windows-latest
            cache-key: rust-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Системные пакеты Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            socat

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.2
        with:
          shared-key: ${{ matrix.cache-key }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: COM-тест на pty (socat)
        if: runner.os == 'Linux'
        env:
          BYTETAP_REQUIRE_SOCAT: "1"
        run: cargo test -p bytetap-core --test serial -- --ignored

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверка дерева зависимостей
        run: npm ls --all

      - name: vue-tsc
        run: npm run check --workspace app

      - name: vitest
        run: npm run test --workspace app

      - name: Сборка фронтенда
        run: npm run build --workspace app

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Сборка сайта
        run: npm run docs:build

  windows-app:
    name: windows-app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.2
        with:
          shared-key: windows-app

      - run: npm ci

      - name: Сборка exe без установщика
        run: npm run tauri build -- --no-bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bytetap-windows-x64
          path: target/release/bytetap.exe
          if-no-files-found: error

      # NFR-3: окно не должно закрываться само. Процесс жив через 15 с, а журнал старта
      # дошёл до «интерфейс готов»: живой процесс с системным окном об ошибке тоже «жив».
      - name: Смоук — запуск exe
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force } else { Write-Host "bytetap.exe завершился, код $($p.ExitCode)" }
          if (Test-Path $log) { Get-Content -Encoding utf8 $log } else { Write-Host "журнала $log нет" }
          $ready = (Test-Path $log) -and (Select-String -Path $log -Pattern 'интерфейс готов' -Quiet -Encoding utf8)
          if (-not $alive -or -not $ready) { exit 1 }

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Установить actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Проверить workflow
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Проверить workflow и dependabot на уязвимости
        run: pipx run zizmor==1.31.1 --min-severity medium .github
