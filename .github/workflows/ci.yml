name: CI

on:
  push:
    # native-ui — ветка этапа U1 (нативный интерфейс) до слияния в main.
    branches: [main, native-ui]
  pull_request:
  # Ручной запуск: `probe=1` добавляет к обычному CI замер цены кадра (U1-AC24),
  # см. job native-probe; `soak=1` — получасовой замер памяти долгой записи
  # (U1-AC24), см. job native-soak.
  workflow_dispatch:
    inputs:
      probe:
        description: "Замер цены кадра на WARP (native-probe)"
        type: boolean
        default: false
      soak:
        description: "Замер памяти долгой записи на loopback (native-soak)"
        type: boolean
        default: false
      soak-minutes:
        description: "native-soak: длительность записи, минут (4…40)"
        type: number
        default: 25
      soak-rate:
        description: "native-soak: фрагментов в секунду"
        type: number
        default: 200

concurrency:
  # Имя события в группе: ручные probe/soak не отменяют и не ждут push.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cache-key: rust-ubuntu
          - os: windows-latest
            cache-key: rust-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # mesa-vulkan-drivers — программный Vulkan (lavapipe) для снимков egui_kittest,
      # socat — pty для COM-теста ядра. GTK и WebKit в сборке больше не нужны: диалоги
      # выбора папки идут через портал рабочего стола (rfd, xdg-portal).
      - name: Системные пакеты и Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers \
            socat

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.2
        with:
          shared-key: ${{ matrix.cache-key }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Конфигурация без тестовых хуков: `--all-targets` тянет dev-dependency приложения
      # на себя с feature `test-hooks`, поэтому код под `cfg(not(feature = "test-hooks"))`
      # в предыдущей команде не собирается вовсе. Windows-ветки того же кода —
      # `--target x86_64-pc-windows-gnu` локально (см. `docs/dev/testing.md`).
      - name: cargo clippy (без хуков)
        if: runner.os == 'Linux'
        run: cargo clippy -p bytetap-app --lib --bins -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      # Функциональные pty-тесты: COM «вместо ЛИС» и прослушка двух портов.
      # Замер задержки (`the_monitor_latency...`) на каждом push не гоняется: пороги
      # времени на общем раннере дают ложные падения. Он остаётся `#[ignore]` и
      # запускается вручную (docs/dev/testing.md).
      - name: COM-тесты на pty (socat)
        if: runner.os == 'Linux'
        env:
          BYTETAP_REQUIRE_SOCAT: "1"
        run: |
          cargo test -p bytetap-core --test serial -- --ignored
          cargo test -p bytetap-core --test monitor_pty -- --ignored --skip the_monitor_latency

      # Эталоны снимков и, при расхождении, *.new.png и *.diff.png egui_kittest.
      - name: Снимки интерфейса
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bytetap-app-snapshots
          path: crates/bytetap-app/tests/snapshots/
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Дерево зависимостей сайта сходится: `npm ci` ставит по lock-файлу, а `npm ls`
      # ловит пакет, которого в дереве нет (например, забытый в `package.json`).
      - name: Зависимости сайта
        run: npm ls --all

      # Общий модуль примера обмена (`shared/control-chips.ts`): node снимает типы
      # сам, тест идёт без сборки.
      - name: Тест модуля обмена
        run: npm test

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V

      # Сторонние лицензии: файл собирается из графа зависимостей bytetap-app.
      - name: Сторонние лицензии актуальны
        run: node scripts/licenses.mjs --check

      - name: Сборка сайта
        run: npm run docs:build

  # U1: нативный bytetap.exe на egui (crates/bytetap-app). Проверяются размер (NFR-7),
  # зависимости от DLL (только системные, U1-AC1) и запуск: процесс жив через 15 с и
  # журнал старта дошёл до «интерфейс готов» — с выбранным адаптером и с WARP (U1-AC2);
  # паника в первом кадре показывает системное окно и пишется в журнал (U1-AC8).
  native-windows:
    name: native-windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.2
        with:
          shared-key: native-windows

      # Смоук-задачи собирают exe с тестовыми хуками (`--features test-hooks`): проба
      # цены кадра, автозапуск записи, паника первого кадра и снимки экранов есть
      # только в такой сборке. Релизный exe — без feature, его проверки ниже.
      - name: cargo build --release (смоук, feature test-hooks)
        run: cargo build --release -p bytetap-app --bin bytetap --features test-hooks

      - name: Смоук — запуск exe
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int attr, out RECT rect, int size);
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc proc, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr hWnd, System.Text.StringBuilder name, int max);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, System.Text.StringBuilder text, int max);
            // Окно-диалог (класс #32770) процесса pid с заголовком title: MessageBox.
            public static bool HasDialog(uint pid, string title) {
              bool found = false;
              EnumWindows((hWnd, lParam) => {
                uint owner;
                GetWindowThreadProcessId(hWnd, out owner);
                if (owner != pid) return true;
                var cls = new System.Text.StringBuilder(256);
                var text = new System.Text.StringBuilder(256);
                GetClassName(hWnd, cls, cls.Capacity);
                GetWindowText(hWnd, text, text.Capacity);
                if (cls.ToString() == "#32770" && text.ToString() == title) { found = true; return false; }
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          '@
          [void][Win]::SetProcessDPIAware()
          $out = New-Item -ItemType Directory -Force -Path smoke
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          $failed = $false
          foreach ($run in @(@{ Name = 'default'; Adapter = '' }, @{ Name = 'warp'; Adapter = 'basic render' })) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $env:WGPU_ADAPTER_NAME = $run.Adapter
            $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
            $null = $p.Handle
            Start-Sleep -Seconds 15
            $alive = -not $p.HasExited
            if ($alive) {
              try {
                $p.Refresh()
                $hwnd = $p.MainWindowHandle
                [void][Win]::SetForegroundWindow($hwnd)
                Start-Sleep -Milliseconds 700
                $rect = New-Object Win+RECT
                # DWMWA_EXTENDED_FRAME_BOUNDS = 9: границы окна без невидимой тени.
                [void][Win]::DwmGetWindowAttribute($hwnd, 9, [ref]$rect, [System.Runtime.InteropServices.Marshal]::SizeOf($rect))
                $w = $rect.Right - $rect.Left; $h = $rect.Bottom - $rect.Top
                Write-Host "$($run.Name): окно ${w}x${h}"
                $bmp = New-Object System.Drawing.Bitmap $w, $h
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                $g.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bmp.Size)
                $bmp.Save((Join-Path $out "window-$($run.Name).png"), [System.Drawing.Imaging.ImageFormat]::Png)
                $g.Dispose(); $bmp.Dispose()
              } catch { Write-Host "снимок окна: $_" }
              Stop-Process -Id $p.Id -Force
            } else {
              Write-Host "$($run.Name): bytetap.exe завершился, код $($p.ExitCode)"
            }
            if (Test-Path $log) {
              Copy-Item $log (Join-Path $out "bytetap-$($run.Name).log")
              Get-Content -Encoding utf8 $log
            } else { Write-Host "журнала $log нет" }
            $ready = (Test-Path $log) -and (Select-String -Path $log -Pattern 'интерфейс готов' -Quiet -Encoding utf8)
            if (-not $alive -or -not $ready) { $failed = $true }
            if ($run.Name -eq 'warp' -and -not (Select-String -Path $log -Pattern 'выбран адаптер wgpu: Microsoft Basic Render Driver' -Quiet -Encoding utf8)) {
              Write-Host 'WARP не выбран'
              $failed = $true
            }
            Start-Sleep -Seconds 1
          }
          $env:WGPU_ADAPTER_NAME = ''

          # Паника в первом кадре: системное окно bytetap поверх всех и запись в журнале.
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:BYTETAP_TEST_HOOKS = '1'
          $env:BYTETAP_TEST_PANIC = '1'
          $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
          $null = $p.Handle
          $dialog = $false
          for ($i = 0; $i -lt 30 -and -not $dialog -and -not $p.HasExited; $i++) {
            Start-Sleep -Seconds 1
            $dialog = [Win]::HasDialog([uint32]$p.Id, 'bytetap')
          }
          $env:BYTETAP_TEST_PANIC = ''
          $env:BYTETAP_TEST_HOOKS = ''
          Write-Host "panic: окно о сбое $(if ($dialog) { 'показано' } else { 'не найдено' })"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } else { Write-Host "panic: bytetap.exe завершился, код $($p.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Test-Path $log) {
            Copy-Item $log (Join-Path $out 'bytetap-panic.log')
            Get-Content -Encoding utf8 $log
          } else { Write-Host "журнала $log нет" }
          $panicked = (Test-Path $log) -and (Select-String -Path $log -Pattern 'паника' -Quiet -Encoding utf8)
          if (-not $dialog -or -not $panicked) { $failed = $true }
          if ($failed) { exit 1 }

      # U1-AC3: рамка окна 1 px видна на белом фоне и не пропадает.
      #
      # Рамку рисует приложение (`window::draw_frame`, последней в кадре), а DWM только
      # скругляет углы. Свою рамку DWM приложение не заказывает: по документации
      # `DWMWA_BORDER_COLOR` DWM не перекрашивает сам при смене состояния окна — это
      # забота приложения, — а системный цвет на белом фоне почти не виден. Поэтому DWM
      # получает `DWMWA_COLOR_NONE`: этот атрибут подавляет отрисовку рамки DWM всегда, и
      # периметр рисует приложение своим цветом. Смоук снимает окно на белом фоне трижды:
      # стартовый экран, экран записи (`BYTETAP_TEST_AUTOSTART` поднимает TCP-сервер) и то
      # же окно записи, когда фокус забрал другой процесс (блокнот) — именно так рамка
      # пропадала у владельца на Windows 11 22000. Пиксели периметра сверяются с токеном
      # `--bt-border` из `design/tokens.css`, контраст — с фоном в 3 px внутрь окна, а
      # журнал запуска — с фактическим скруглением окна (`DWMWCP_ROUND` — DWM скругляет
      # углы, `DWMWCP_DONOTROUND` на программном растре — углы квадратные).
      - name: Смоук — рамка окна на белом фоне
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class FrameWin {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hwnd, IntPtr after, int x, int y, int cx, int cy, uint flags);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int attr, out RECT rect, int size);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int attr, out int value, int size);
          }
          '@
          [void][FrameWin]::SetProcessDPIAware()
          $out = New-Item -ItemType Directory -Force -Path smoke
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          $failed = $false

          # Цвета рамки — из токенов темы, допуск на канал 8: снимок проходит через
          # масштаб экрана раннера.
          $tokens = Get-Content design/tokens.css -Raw
          $borderHex = @([regex]::Matches($tokens, '--bt-border:\s*#([0-9a-fA-F]{6})') |
            ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)
          Write-Host "цвета --bt-border: $($borderHex -join ', ')"
          if ($borderHex.Count -eq 0) {
            Write-Host 'в design/tokens.css нет --bt-border'
            $failed = $true
          }
          $borderColors = @(foreach ($hex in $borderHex) {
            [System.Drawing.Color]::FromArgb(255,
              [Convert]::ToInt32($hex.Substring(0, 2), 16),
              [Convert]::ToInt32($hex.Substring(2, 2), 16),
              [Convert]::ToInt32($hex.Substring(4, 2), 16))
          })

          # Снимок окна на белом фоне и сверка периметра. Углы не трогаем: там
          # скругление и сглаживание. По середине каждой стороны берём 21 точку через
          # 2 px и ищем цвет рамки в полосе ±2 px от края окна; кадр шире границ окна
          # на $pad пикселей, иначе размытие скругления съедает пиксели края.
          function Measure-Frame {
            param([IntPtr]$hwnd, [string]$name)
            $pad = 8
            $band = 2
            $tolerance = 8
            $contrast = 12
            $inner = 3
            $rect = New-Object FrameWin+RECT
            # DWMWA_EXTENDED_FRAME_BOUNDS = 9: границы окна без невидимой тени.
            [void][FrameWin]::DwmGetWindowAttribute($hwnd, 9, [ref]$rect, [System.Runtime.InteropServices.Marshal]::SizeOf($rect))
            $w = $rect.Right - $rect.Left; $h = $rect.Bottom - $rect.Top
            Write-Host "${name}: окно ${w}x${h}"
            if ($w -lt 100 -or $h -lt 100) {
              Write-Host "${name}: окно не найдено"
              return $null
            }
            # Скругление (33) — как его задало приложение. Цвет рамки (34) атрибут
            # только для записи, его не прочитать: о нём пишет журнал запуска.
            $corner = 0
            [void][FrameWin]::DwmGetWindowAttribute($hwnd, 33, [ref]$corner, 4)
            $shot = New-Object System.Drawing.Bitmap ($w + 2 * $pad), ($h + 2 * $pad)
            $g = [System.Drawing.Graphics]::FromImage($shot)
            $g.CopyFromScreen($rect.Left - $pad, $rect.Top - $pad, 0, 0, $shot.Size)
            $g.Dispose()
            $margin = 24
            $canvas = New-Object System.Drawing.Bitmap ($shot.Width + 2 * $margin), ($shot.Height + 2 * $margin)
            $cg = [System.Drawing.Graphics]::FromImage($canvas)
            $cg.Clear([System.Drawing.Color]::White)
            $cg.DrawImage($shot, $margin, $margin)
            $cg.Dispose()
            $canvas.Save((Join-Path $out "window-frame-$name.png"), [System.Drawing.Imaging.ImageFormat]::Png)

            $samples = @()
            for ($i = -10; $i -le 10; $i++) {
              $samples += @{ X = [int]($pad + $w / 2 + $i * 2); Y = [int]$pad; Vert = $true; In = 1 }
              $samples += @{ X = [int]($pad + $w / 2 + $i * 2); Y = [int]($pad + $h - 1); Vert = $true; In = -1 }
              $samples += @{ X = [int]$pad; Y = [int]($pad + $h / 2 + $i * 2); Vert = $false; In = 1 }
              $samples += @{ X = [int]($pad + $w - 1); Y = [int]($pad + $h / 2 + $i * 2); Vert = $false; In = -1 }
            }
            $hits = 0
            foreach ($sample in $samples) {
              $found = $false
              for ($d = -$band; $d -le $band -and -not $found; $d++) {
                $x = [int]$sample.X
                $y = [int]$sample.Y
                if ($sample.Vert) { $y = $y + $d } else { $x = $x + $d }
                if ($x -lt 0 -or $y -lt 0 -or $x -ge $shot.Width -or $y -ge $shot.Height) { continue }
                $px = $shot.GetPixel($x, $y)
                foreach ($want in $borderColors) {
                  if (([Math]::Abs([int]$px.R - [int]$want.R) -le $tolerance) -and
                      ([Math]::Abs([int]$px.G - [int]$want.G) -le $tolerance) -and
                      ([Math]::Abs([int]$px.B - [int]$want.B) -le $tolerance)) { $found = $true; break }
                }
              }
              if (-not $found) { continue }
              # Тот же край, но на 3 px внутрь окна: там фон, и рамка должна от него
              # отличаться хотя бы на $contrast по одному каналу.
              $x = [int]$sample.X
              $y = [int]$sample.Y
              if ($sample.Vert) { $y = $y + $sample.In * $inner } else { $x = $x + $sample.In * $inner }
              if ($x -lt 0 -or $y -lt 0 -or $x -ge $shot.Width -or $y -ge $shot.Height) { continue }
              $bg = $shot.GetPixel($x, $y)
              $diff = [Math]::Max(
                [Math]::Abs([int]$bg.R - [int]$px.R),
                [Math]::Max([Math]::Abs([int]$bg.G - [int]$px.G), [Math]::Abs([int]$bg.B - [int]$px.B)))
              if ($diff -lt $contrast) { continue }
              $hits++
            }
            Write-Host "$name : пикселей периметра цветом --bt-border: $hits из $($samples.Count), скругление $corner"
            $shot.Dispose(); $canvas.Dispose()
            return @{ Hits = $hits; Total = $samples.Count; Corner = $corner }
          }

          # Окно меньше экрана раннера (1024×768) и в верхнем левом углу: видны все
          # четыре стороны рамки.
          function Place-Window {
            param([IntPtr]$hwnd, [int]$x, [int]$y, [int]$w, [int]$h)
            # SWP_NOZORDER | SWP_NOACTIVATE
            [void][FrameWin]::SetWindowPos($hwnd, [IntPtr]::Zero, $x, $y, $w, $h, 0x14)
          }

          function Check-Frame {
            param($measured, [string]$name)
            if ($null -eq $measured) { return $false }
            if ($measured.Hits -lt [int]($measured.Total * 0.9)) {
              Write-Host "$name : рамка окна не совпадает с --bt-border на снимке или не видна на белом"
              return $false
            }
            return $true
          }

          # Проверка журнала запуска: рамка, скругление и скрытая рамка DWM. Журнал
          # должен говорить то же, что показывает окно: атрибут скругления (33) снимка
          # сверяется с его строкой (`DWMWCP_ROUND` — 2, `DWMWCP_DONOTROUND` — 1).
          function Check-FrameLog {
            param([string]$name, $measured)
            if (-not (Test-Path $log)) { Write-Host "$name : журнала нет"; return $false }
            Copy-Item $log (Join-Path $out "bytetap-frame-$name.log") -Force
            Get-Content -Encoding utf8 $log
            $ok = $true
            if (-not (Select-String -Path $log -Pattern 'рамка окна' -Quiet -Encoding utf8)) {
              Write-Host "$name : в журнале запуска нет записей о рамке окна"
              $ok = $false
            }
            $corner = Select-String -Path $log -Pattern 'DWM скругляет углы' -Quiet -Encoding utf8
            $hidden = Select-String -Path $log -Pattern 'DWM-рамка скрыта \(DWMWA_COLOR_NONE\), свою рисует приложение цветом #[0-9a-f]{6}' -Quiet -Encoding utf8
            $own = Select-String -Path $log -Pattern 'рамку рисует приложение' -Quiet -Encoding utf8
            $software = Select-String -Path $log -Pattern 'программный растр — углы квадратные \(DWMWCP_DONOTROUND\)' -Quiet -Encoding utf8
            if ($corner) {
              Write-Host "$name : DWM скругляет углы, рамку рисует приложение"
              if (-not $hidden) {
                Write-Host "$name : DWM не принял DWMWA_COLOR_NONE — рамку может нарисовать DWM"
                $ok = $false
              }
            } elseif ($software) {
              Write-Host "$name : программный растр — углы квадратные (DWMWCP_DONOTROUND), рамку рисует приложение"
            } elseif ($own) {
              Write-Host "$name : DWM-скругления нет: рамку рисует приложение с квадратными углами"
            } else {
              Write-Host "$name : в журнале запуска нет ни DWM-скругления, ни своей рамки"
              $ok = $false
            }
            # Скругление окна по снимку и строка журнала про одно и то же.
            if ($null -ne $measured) {
              $pref = [int]$measured.Corner
              Write-Host "$name : скругление окна $pref, журнал $(if ($corner) { 'DWM скругляет' } elseif ($software) { 'программный растр' } else { 'без скругления' })"
              if ($pref -eq 2 -and -not $corner) { Write-Host "$name : окно скруглено, а журнал этого не пишет"; $ok = $false }
              if ($pref -eq 1 -and -not ($software -or $own)) { Write-Host "$name : окно без скругления, а журнал об этом молчит"; $ok = $false }
            }
            return $ok
          }

          # 1. Стартовый экран: рамку видно без переключения темы и без записи.
          Remove-Item $log -ErrorAction SilentlyContinue
          $startShot = $null
          $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "стартовый экран: bytetap.exe завершился, код $($p.ExitCode)"
            $failed = $true
          } else {
            try {
              $p.Refresh()
              $hwnd = $p.MainWindowHandle
              [void][FrameWin]::SetForegroundWindow($hwnd)
              Place-Window $hwnd 8 8 720 560
              Start-Sleep -Milliseconds 900
              $startShot = Measure-Frame $hwnd 'start'
              if (-not (Check-Frame $startShot 'стартовый экран')) { $failed = $true }
            } catch { Write-Host "стартовый экран: $_"; $failed = $true }
            Stop-Process -Id $p.Id -Force
          }
          if (-not (Check-FrameLog 'start' $startShot)) { $failed = $true }

          # 2. Экран записи: прослушивание уже идёт, шапка, трасса и лента нарисованы.
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:BYTETAP_TEST_HOOKS = '1'
          $env:BYTETAP_TEST_AUTOSTART = 'tcp_server:127.0.0.1:0'
          $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
          $null = $p.Handle
          $env:BYTETAP_TEST_AUTOSTART = ''
          $env:BYTETAP_TEST_HOOKS = ''
          $recording = $false
          $recordingShot = $null
          for ($i = 0; $i -lt 60 -and -not $recording -and -not $p.HasExited; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $log) {
              $recording = Select-String -Path $log -Pattern 'запись идёт: адрес' -Quiet -Encoding utf8
            }
          }
          if (-not $recording) {
            Write-Host 'экран записи: прослушивание не началось'
            $failed = $true
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          } else {
            Start-Sleep -Seconds 2
            try {
              $p.Refresh()
              $hwnd = $p.MainWindowHandle
              [void][FrameWin]::SetForegroundWindow($hwnd)
              Place-Window $hwnd 8 8 720 560
              Start-Sleep -Milliseconds 900
              $recordingShot = Measure-Frame $hwnd 'recording'
              if (-not (Check-Frame $recordingShot 'экран записи')) { $failed = $true }

              # 3. То же окно записи без фокуса: рамка DWM гасится при смене
              # активности, своя — нет. Блокнот ставим рядом, чтобы не накрыть окно.
              $note = Start-Process -FilePath 'notepad.exe' -PassThru
              $null = $note.Handle
              $noteHwnd = [IntPtr]::Zero
              for ($i = 0; $i -lt 20 -and $noteHwnd -eq [IntPtr]::Zero -and -not $note.HasExited; $i++) {
                Start-Sleep -Milliseconds 500
                $note.Refresh()
                $noteHwnd = $note.MainWindowHandle
              }
              if ($noteHwnd -eq [IntPtr]::Zero) {
                Write-Host 'окно без фокуса: блокнот не открылся'
                $failed = $true
              } else {
                Place-Window $noteHwnd 760 120 240 200
                [void][FrameWin]::SetForegroundWindow($noteHwnd)
                Start-Sleep -Milliseconds 900
                $active = [FrameWin]::GetForegroundWindow()
                Write-Host "окно без фокуса: активно чужое окно $($active -ne $hwnd)"
                if ($active -eq $hwnd) {
                  Write-Host 'окно без фокуса: фокус остался у bytetap'
                  $failed = $true
                }
                if (-not (Check-Frame (Measure-Frame $hwnd 'inactive') 'окно без фокуса')) { $failed = $true }
                # Смену активности видно и в журнале запуска: строка о первой потере
                # фокуса за запуск (`track_window_activation`, `window.rs`). Окно теряет
                # фокус асинхронно, поэтому строка ищется с ожиданием.
                $confirmed = $false
                for ($i = 0; $i -lt 20 -and -not $confirmed; $i++) {
                  if (Test-Path $log) {
                    $confirmed = Select-String -Path $log -Pattern 'рамка окна: окно неактивно' -Quiet -Encoding utf8
                  }
                  if (-not $confirmed) { Start-Sleep -Milliseconds 250 }
                }
                Write-Host "окно без фокуса: журнал подтвердил смену активности $confirmed"
                if (-not $confirmed) {
                  Write-Host 'окно без фокуса: в журнале запуска нет строки «рамка окна: окно неактивно»'
                  $failed = $true
                }
                Stop-Process -Id $note.Id -Force -ErrorAction SilentlyContinue
              }
            } catch { Write-Host "экран записи: $_"; $failed = $true }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          if (-not (Check-FrameLog 'recording' $recordingShot)) { $failed = $true }
          if ($failed) { exit 1 }

      - name: Смоук — запись HL7 и закрытие окна
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path smoke
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:BYTETAP_TEST_HOOKS = '1'
          $env:BYTETAP_TEST_AUTOSTART = 'tcp_server:127.0.0.1:0'
          $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
          $null = $p.Handle
          $env:BYTETAP_TEST_AUTOSTART = ''
          $env:BYTETAP_TEST_HOOKS = ''
          $failed = $false
          $addr = $null
          $journal = $null
          for ($i = 0; $i -lt 60 -and -not $addr -and -not $p.HasExited; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $log) {
              $found = Select-String -Path $log -Pattern 'запись идёт: адрес ([^,\s]+), журнал (.+)$' -Encoding utf8 | Select-Object -First 1
              if ($found) {
                $addr = $found.Matches[0].Groups[1].Value
                $journal = $found.Matches[0].Groups[2].Value.Trim()
              }
            }
          }
          if (-not $addr) {
            Write-Host 'запись не началась'
            $failed = $true
          } else {
            Write-Host "запись: $addr, журнал $journal"
            try {
              $port = [int]($addr -split ':')[-1]
              $client = New-Object System.Net.Sockets.TcpClient
              $client.Connect('127.0.0.1', $port)
              $stream = $client.GetStream()
              $stream.ReadTimeout = 10000
              $text = "MSH|^~\&|ANALYZER|LAB|LIS||20261019101500||ORU^R01|MSG00001|P|2.3.1`rPID|1||000001||PATIENT^TEST`r"
              [byte[]]$frame = @(0x0b) + [System.Text.Encoding]::ASCII.GetBytes($text) + @(0x1c, 0x0d)
              $stream.Write($frame, 0, $frame.Length)
              $buffer = New-Object byte[] 4096
              $ack = New-Object System.Collections.Generic.List[byte]
              while (-not ($ack.Count -ge 2 -and $ack[$ack.Count - 2] -eq 0x1c -and $ack[$ack.Count - 1] -eq 0x0d)) {
                $n = $stream.Read($buffer, 0, $buffer.Length)
                if ($n -le 0) { break }
                $ack.AddRange([byte[]]$buffer[0..($n - 1)])
              }
              $ackText = [System.Text.Encoding]::ASCII.GetString($ack.ToArray())
              Write-Host "ACK: $($ackText -replace "`r", '<CR>')"
              if ($ackText -notmatch 'MSA\|AA\|MSG00001') { Write-Host 'ACK не тот'; $failed = $true }
              $client.Close()
            } catch {
              Write-Host "клиент HL7: $_"
              $failed = $true
            }
          }
          if (-not $p.HasExited) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            # WM_CLOSE главному окну: так же, как «Закрыть» в шапке или Alt+F4.
            [void]$p.CloseMainWindow()
            if (-not $p.WaitForExit(30000)) {
              Write-Host 'bytetap.exe не закрылся за 30 с'
              Stop-Process -Id $p.Id -Force
              $failed = $true
            } else {
              Write-Host "bytetap.exe закрылся, код $($p.ExitCode)"
              if ($p.ExitCode -ne 0) { $failed = $true }
            }
          } else {
            Write-Host "bytetap.exe завершился сам, код $($p.ExitCode)"
            $failed = $true
          }
          if (Test-Path $log) {
            Copy-Item $log (Join-Path $out 'bytetap-recording.log')
            Get-Content -Encoding utf8 $log
          }
          if ($journal -and (Test-Path $journal)) {
            # Журнал синтетический: сообщение выше, данных приборов в нём нет.
            Copy-Item $journal (Join-Path $out 'recording-session.jsonl')
            $last = Get-Content -Encoding utf8 $journal | Select-Object -Last 1
            Write-Host "последняя строка журнала: $last"
            if ($last -notmatch '"type":"session_end"') { $failed = $true }
            $data = (Select-String -Path $journal -Pattern '"type":"data"' -Encoding utf8).Count
            Write-Host "фрагментов в журнале: $data"
            if ($data -lt 2) { $failed = $true }
          } else {
            Write-Host "журнала сессии $journal нет"
            $failed = $true
          }
          if (-not (Select-String -Path $log -Pattern 'запись остановлена, окно закрывается' -Quiet -Encoding utf8)) {
            Write-Host 'окно закрылось без штатной остановки записи'
            $failed = $true
          }
          if ($failed) { exit 1 }

      # M4-AC15 (FR-5…FR-8): смоук прокси. Тестовый хук `BYTETAP_TEST_AUTOSTART` в формате
      # `proxy:<адрес>><цель>:<роль>` поднимает сессию прокси на loopback; «ЛИС» —
      # слушатель PowerShell в отдельном задании (порт он сообщает через файл, чтобы
      # bytetap получил его до старта). Анализатор шлёт HL7 через прокси, ЛИС отвечает
      # ACK, анализатор получает этот ACK. Затем окно закрывается штатно: в журнале
      # прокси есть `open` пары с `link`, обе стороны в `data` и `session_end`.
      - name: Смоук — прокси между анализатором и ЛИС
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path smoke
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $portFile = Join-Path $env:TEMP 'bytetap-lis-port.txt'
          Remove-Item $portFile -ErrorAction SilentlyContinue
          $failed = $false

          # ЛИС: слушает свой порт, принимает одно соединение прокси и отвечает ACK.
          $lis = Start-Job -ArgumentList $portFile -ScriptBlock {
            param([string]$portFile)
            $listener = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, 0)
            $listener.Start()
            Set-Content -Path $portFile -Value $listener.LocalEndpoint.Port -Encoding ascii
            $client = $listener.AcceptTcpClient()
            $stream = $client.GetStream()
            $buffer = New-Object byte[] 4096
            $read = $stream.Read($buffer, 0, $buffer.Length)
            if ($read -le 0) { Write-Output 'no data'; return }
            $text = "MSH|^~\&|LIS|LAB|ANALYZER|LAB|20261022101530||ACK^R01|BT0001|P|2.3.1`rMSA|AA|MSG00001`r"
            [byte[]]$frame = @(0x0b) + [System.Text.Encoding]::ASCII.GetBytes($text) + @(0x1c, 0x0d)
            $stream.Write($frame, 0, $frame.Length)
            $stream.Flush()
            Start-Sleep -Milliseconds 200
            $client.Close()
            $listener.Stop()
            Write-Output 'ok'
          }
          # Задание ЛИС — отдельный процесс PowerShell: на холодном раннере он
          # поднимается дольше десяти секунд, поэтому ждём до тридцати.
          $port = $null
          for ($i = 0; $i -lt 120 -and -not $port; $i++) {
            Start-Sleep -Milliseconds 250
            if (Test-Path $portFile) { $port = (Get-Content $portFile -Raw).Trim() }
          }
          if (-not $port) {
            Write-Host 'ЛИС не поднялась: порт не сообщён'
            $failed = $true
          } else {
            Write-Host "ЛИС слушает 127.0.0.1:$port"
            $env:BYTETAP_TEST_HOOKS = '1'
            $env:BYTETAP_TEST_AUTOSTART = "proxy:127.0.0.1:0>127.0.0.1:${port}:analyzer_client"
            $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
            $null = $p.Handle
            $env:BYTETAP_TEST_AUTOSTART = ''
            $env:BYTETAP_TEST_HOOKS = ''
            $addr = $null
            $journal = $null
            for ($i = 0; $i -lt 60 -and -not $addr -and -not $p.HasExited; $i++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $log) {
                $found = Select-String -Path $log -Pattern 'запись идёт: адрес ([^,\s]+), журнал (.+)$' -Encoding utf8 | Select-Object -First 1
                if ($found) {
                  $addr = $found.Matches[0].Groups[1].Value
                  $journal = $found.Matches[0].Groups[2].Value.Trim()
                }
              }
            }
            if (-not $addr) {
              Write-Host 'прокси не поднялся: прослушивания нет'
              $failed = $true
            } else {
              Write-Host "прокси: $addr, журнал $journal"
              try {
                $proxyPort = [int]($addr -split ':')[-1]
                $client = New-Object System.Net.Sockets.TcpClient
                $client.Connect('127.0.0.1', $proxyPort)
                $stream = $client.GetStream()
                $stream.ReadTimeout = 10000
                $text = "MSH|^~\&|ANALYZER|LAB|LIS||20261022101500||ORU^R01|MSG00001|P|2.3.1`rPID|1||000001||PATIENT^TEST`r"
                [byte[]]$frame = @(0x0b) + [System.Text.Encoding]::ASCII.GetBytes($text) + @(0x1c, 0x0d)
                $stream.Write($frame, 0, $frame.Length)
                $buffer = New-Object byte[] 4096
                $ack = New-Object System.Collections.Generic.List[byte]
                while (-not ($ack.Count -ge 2 -and $ack[$ack.Count - 2] -eq 0x1c -and $ack[$ack.Count - 1] -eq 0x0d)) {
                  $n = $stream.Read($buffer, 0, $buffer.Length)
                  if ($n -le 0) { break }
                  $ack.AddRange([byte[]]$buffer[0..($n - 1)])
                }
                $ackText = [System.Text.Encoding]::ASCII.GetString($ack.ToArray())
                Write-Host "ACK через прокси: $($ackText -replace "`r", '<CR>')"
                if ($ackText -notmatch 'MSA\|AA\|MSG00001') { Write-Host 'ACK от ЛИС не дошёл'; $failed = $true }
                $client.Close()
              } catch {
                Write-Host "клиент HL7 через прокси: $_"
                $failed = $true
              }
              # Задание ЛИС ждёт соединения: срок на ответ, чтобы шаг не висел.
              $null = Wait-Job -Job $lis -Timeout 30
              $jobOutput = Receive-Job -Job $lis
              Write-Host "ЛИС: $jobOutput"
              if ($jobOutput -notcontains 'ok') { Write-Host 'ЛИС не подтвердила сообщение'; $failed = $true }
            }
            if (-not $p.HasExited) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              [void]$p.CloseMainWindow()
              if (-not $p.WaitForExit(30000)) {
                Write-Host 'bytetap.exe не закрылся за 30 с'
                Stop-Process -Id $p.Id -Force
                $failed = $true
              } elseif ($p.ExitCode -ne 0) {
                Write-Host "bytetap.exe закрылся, код $($p.ExitCode)"
                $failed = $true
              } else {
                Write-Host "bytetap.exe закрылся, код $($p.ExitCode)"
              }
            } else {
              Write-Host "bytetap.exe завершился сам, код $($p.ExitCode)"
              $failed = $true
            }
          }
          Stop-Job -Job $lis -ErrorAction SilentlyContinue
          Remove-Job -Job $lis -Force -ErrorAction SilentlyContinue
          if (Test-Path $log) {
            Copy-Item $log (Join-Path $out 'bytetap-proxy.log')
            Get-Content -Encoding utf8 $log
            if (-not (Select-String -Path $log -Pattern 'интерфейс готов' -Quiet -Encoding utf8)) {
              Write-Host 'в журнале запуска нет «интерфейс готов»'
              $failed = $true
            }
          }
          if ($journal -and (Test-Path $journal)) {
            # Журнал синтетический: сообщение выше, данных приборов в нём нет.
            Copy-Item $journal (Join-Path $out 'proxy-session.jsonl')
            $lines = Get-Content -Encoding utf8 $journal
            $lines | Select-Object -Last 5
            if ($lines[-1] -notmatch '"type":"session_end"') { Write-Host 'журнал не закончен session_end'; $failed = $true }
            $open = $lines | Where-Object { $_ -match '"type":"open"' } | Select-Object -First 1
            if (-not ($open -and $open -match '"link":\{"role":"lis"')) {
              Write-Host "в журнале нет open с link на ЛИС: $open"
              $failed = $true
            }
            $dirs = ($lines | Where-Object { $_ -match '"type":"data"' } | ForEach-Object {
              if ($_ -match '"dir":"analyzer_to_lis"') { 'a2l' } elseif ($_ -match '"dir":"lis_to_analyzer"') { 'l2a' }
            })
            Write-Host "направления в журнале прокси: $($dirs -join ', ')"
            if (-not ($dirs -contains 'a2l' -and $dirs -contains 'l2a')) {
              Write-Host 'в журнале нет фрагментов обеих сторон'
              $failed = $true
            }
            $header = $lines | Select-Object -First 1
            if ($header -notmatch '"mode":"proxy"') { Write-Host 'режим журнала не proxy'; $failed = $true }
          } else {
            Write-Host "журнала прокси $journal нет"
            $failed = $true
          }
          if ($failed) { exit 1 }

      # U1-AC24 (NFR-5): CPU живого процесса. В простое окно не рисует кадров, и
      # процесс почти не занимает ядро; во время записи кадр рисуется ~30 раз в
      # секунду, и его цена на WARP — это цена интерфейса. Оба числа пишутся в
      # журнал CI и в smoke/cpu-*.txt, порог в простое — 2 % одного ядра.
      - name: Смоук — CPU в простое и при записи
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class CpuWin {
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hwnd, int cmd);
          }
          '@
          $out = New-Item -ItemType Directory -Force -Path smoke
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          $ready = {
            param($log, $seconds)
            for ($i = 0; $i -lt $seconds * 2; $i++) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'интерфейс готов' -Quiet -Encoding utf8)) { return $true }
              Start-Sleep -Milliseconds 500
            }
            return $false
          }
          $failed = $false

          # Простой: окно открыто, записи нет.
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:BYTETAP_TEST_HOOKS = ''
          $env:BYTETAP_TEST_SCREEN = ''
          $env:BYTETAP_TEST_AUTOSTART = ''
          $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
          $null = $p.Handle
          if (-not (& $ready $log 40)) { Write-Host 'интерфейс не готов'; $failed = $true }
          Start-Sleep -Seconds 2
          $p.Refresh()
          $t0 = $p.TotalProcessorTime.TotalSeconds
          Start-Sleep -Seconds 10
          $p.Refresh()
          $idle = ($p.TotalProcessorTime.TotalSeconds - $t0) / 10 * 100
          $cores = [Environment]::ProcessorCount
          $line = "CPU в простое за 10 с: {0:N2} % одного ядра (логических ядер: {1})" -f $idle, $cores
          Write-Host $line
          $line | Out-File -Encoding utf8 smoke/cpu-idle.txt
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          # В простое окно не рисует вовсе: замеры дают 0.00 % (U1-AC24), порог 0.5 %
          # пропускает шум раннера и ловит возврат к кадрам без событий.
          if ($idle -ge 0.5) { Write-Host "CPU в простое $idle % — больше 0.5 % одного ядра"; $failed = $true }

          # Запись: клиент шлёт 10 сообщений HL7 каждые 100 мс — поток 100 фрагментов/с,
          # лента и трасса перерисовываются на каждый кадр.
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:BYTETAP_TEST_HOOKS = '1'
          $env:BYTETAP_TEST_AUTOSTART = 'tcp_server:127.0.0.1:0'
          $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
          $null = $p.Handle
          $env:BYTETAP_TEST_AUTOSTART = ''
          $env:BYTETAP_TEST_HOOKS = ''
          $addr = $null
          for ($i = 0; $i -lt 60 -and -not $addr; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $log) {
              $found = Select-String -Path $log -Pattern 'запись идёт: адрес ([^,\s]+), журнал (.+)$' -Encoding utf8 | Select-Object -First 1
              if ($found) { $addr = $found.Matches[0].Groups[1].Value; $journal = $found.Matches[0].Groups[2].Value.Trim() }
            }
          }
          if (-not $addr) {
            Write-Host 'запись не началась'
            $failed = $true
          } else {
            $port = [int]($addr -split ':')[-1]
            $sender = Start-Job -ScriptBlock {
              param($port)
              $client = New-Object System.Net.Sockets.TcpClient
              $client.Connect('127.0.0.1', $port)
              $stream = $client.GetStream()
              $stream.ReadTimeout = 500
              $buffer = New-Object byte[] 4096
              # 25 с: поток идёт и во втором окне замера, со свёрнутым окном.
              for ($i = 0; $i -lt 250; $i++) {
                $text = "MSH|^~\&|ANALYZER|LAB|LIS||20261019101500||ORU^R01|MSG$i|P|2.3.1`rPID|1||000001||PATIENT^TEST`rOBX|1|NM|GLU^Glucose||5.4|mmol/L`r"
                [byte[]]$frame = @(0x0b) + [System.Text.Encoding]::ASCII.GetBytes($text) + @(0x1c, 0x0d)
                try { $stream.Write($frame, 0, $frame.Length) } catch { break }
                # Автоответы: читаем, чтобы буфер сокета не переполнился.
                try { $null = $stream.Read($buffer, 0, $buffer.Length) } catch { }
                Start-Sleep -Milliseconds 100
              }
              $client.Close()
            } -ArgumentList $port
            Start-Sleep -Seconds 2
            $p.Refresh()
            $t0 = $p.TotalProcessorTime.TotalSeconds
            Start-Sleep -Seconds 10
            $p.Refresh()
            $busy = ($p.TotalProcessorTime.TotalSeconds - $t0) / 10 * 100
            $line = "CPU при записи 100 фрагментов/с за 10 с: {0:N2} % одного ядра (WARP, программный растр)" -f $busy
            Write-Host $line
            $line | Out-File -Encoding utf8 smoke/cpu-recording.txt
            # Сколько из этого — кадры, а сколько — сама сессия: то же окно в том же
            # потоке, но свёрнутое. Свёрнутое окно кадров не рисует
            # (`sleep_if_invisible_or_minimized` в eframe), поток фрагментов идёт.
            $hwnd = $p.MainWindowHandle
            [void][CpuWin]::ShowWindow($hwnd, 6)
            Start-Sleep -Seconds 2
            $p.Refresh()
            $t1 = $p.TotalProcessorTime.TotalSeconds
            Start-Sleep -Seconds 6
            $p.Refresh()
            $hidden = ($p.TotalProcessorTime.TotalSeconds - $t1) / 6 * 100
            $line = "CPU при записи со свёрнутым окном (без кадров) за 6 с: {0:N2} % одного ядра" -f $hidden
            Write-Host $line
            $line | Out-File -Encoding utf8 smoke/cpu-recording.txt -Append
            [void][CpuWin]::ShowWindow($hwnd, 9)
            Start-Sleep -Milliseconds 500
            # Замер до правки частоты кадров (run 28b98b3): 306 % одного ядра и 6.2
            # кадра/с — окно просило кадр 30 раз в секунду, а кадр WARP стоит около
            # ядра·секунды. Теперь период выбирается по цене кадра
            # (live::next_period), и на этой цене окно рисует раз в секунду.
            $beforeCpu = 306.0
            $beforeFps = 6.2
            $line = "было: {0:N0} % одного ядра и {1:N1} кадра/с; стало: {2:N2} % и см. кадры/с из журнала" -f $beforeCpu, $beforeFps, $busy
            Write-Host $line
            $line | Out-File -Encoding utf8 smoke/cpu-recording.txt -Append
            # Порог — по разбросу раннера: два прогона одной сборки дали 114 и 258 %
            # (общий раннер, цена кадра гуляет 204↔247 мс, сверх таймера окно получает
            # кадры от системы). 280 ниже прежних 306 и ловит только возврат к ним.
            if ($busy -ge 280.0) { Write-Host "CPU при записи $busy % — больше 280 % одного ядра"; $failed = $true }
          }
          # Остановка штатная (WM_CLOSE): журнал запуска получает итог кадров записи.
          if (-not $p.HasExited) {
            $null = $p.CloseMainWindow()
            if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; $failed = $true }
          }
          if ($addr -and (Test-Path $log)) {
            $frames = Select-String -Path $log -Pattern 'кадров за запись: (\d+), ([\d.]+) в секунду' -Encoding utf8 | Select-Object -Last 1
            $cost = Select-String -Path $log -Pattern 'цена кадра записи: (\d+) мс, период запроса кадра (\d+) мс' -Encoding utf8 | Select-Object -Last 1
            if ($cost) {
              $line = "цена кадра {0} мс, период запроса кадра {1} мс" -f $cost.Matches[0].Groups[1].Value, $cost.Matches[0].Groups[2].Value
              Write-Host $line
              $line | Out-File -Encoding utf8 smoke/cpu-recording.txt -Append
              # Цена кадра WARP на раннере — 16…250 мс (U1-AC24); период растёт вместе с
              # ценой (live::next_period), но не дальше секунды.
              if ([int]$cost.Matches[0].Groups[1].Value -ge 1000) { Write-Host 'кадр дороже секунды'; $failed = $true }
              if ([int]$cost.Matches[0].Groups[2].Value -gt 1000) { Write-Host 'кадр просится реже раза в секунду'; $failed = $true }
            } else {
              Write-Host 'в журнале запуска нет цены кадра записи'
              $failed = $true
            }
            if ($frames) {
              $count = [int]$frames.Matches[0].Groups[1].Value
              $fps = [double]$frames.Matches[0].Groups[2].Value
              $count | Out-File -Encoding utf8 smoke/cpu-recording.txt -Append
              Write-Host ("кадров за запись: {0}, {1:N1} в секунду" -f $count, $fps)
              # Данные ленты не теряются при редких кадрах — их держит буфер, — но совсем
              # замереть лента не должна: кадр идёт и при записи без новых событий.
              if ($fps -lt 0.5) { Write-Host "перерисовка $fps кадров в секунду — лента не идёт"; $failed = $true }
              if ($fps -gt 33.0) { Write-Host "перерисовка $fps кадров в секунду — чаще 30"; $failed = $true }
            } else {
              Write-Host 'в журнале запуска нет итога кадров записи'
              $failed = $true
            }
          }
          if (Get-Job -Id $sender.Id -ErrorAction SilentlyContinue) { Stop-Job $sender; Remove-Job $sender -Force }
          if ($failed) { exit 1 }

      # U1-AC21: снимки всех экранов в обеих темах из настоящего exe — владелец
      # согласует по ним вид. Экраны задаёт тестовый хук BYTETAP_TEST_SCREEN (он
      # читается только вместе с BYTETAP_TEST_HOOKS=1, см. app.rs). Окно ставится по
      # рабочему столу раннера: 1200×800 в экран 1024×768 не влезает, и снимок вышел
      # бы обрезанным. Эталон 1200×800 — снимки egui_kittest в review/kittest.
      - name: Снимки — экраны для согласования
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Shot {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hwnd, IntPtr after, int x, int y, int cx, int cy, uint flags);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int attr, out RECT rect, int size);
          }
          '@
          [void][Shot]::SetProcessDPIAware()
          $out = New-Item -ItemType Directory -Force -Path review
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          $area = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
          $w = [Math]::Min(1200, $area.Width - 24)
          $h = [Math]::Min(800, $area.Height - 24)
          Write-Host "снимки: окно ${w}x${h} в рабочем столе $($area.Width)x$($area.Height)"
          $screens = @(
            'start-light', 'start-dark',
            'server-light', 'server-dark',
            'client-light', 'client-dark',
            'serial-light', 'serial-dark',
            'serial-more-light', 'serial-more-dark',
            'errors-light', 'errors-dark',
            'recording-text-light', 'recording-text-dark',
            'recording-hex-light', 'recording-hex-dark',
            'failure-light', 'failure-dark',
            'viewing-text-light', 'viewing-text-dark',
            'viewing-hex-light', 'viewing-hex-dark',
            'menu-journals-light', 'menu-journals-dark',
            'menu-record-light', 'menu-record-dark',
            'note-light', 'note-dark',
            'profile-light', 'profile-dark'
          )
          $journal = $null
          $index = 0
          $failed = $false
          foreach ($name in $screens) {
            $index++
            Remove-Item $log -ErrorAction SilentlyContinue
            $env:BYTETAP_TEST_HOOKS = '1'
            $env:BYTETAP_TEST_SCREEN = $name
            $env:BYTETAP_TEST_JOURNAL = ''
            $env:BYTETAP_TEST_AUTOSTART = ''
            if ($name -match '^(recording|menu-record|note)') { $env:BYTETAP_TEST_AUTOSTART = 'tcp_server:127.0.0.1:0' }
            if ($name -match '^viewing-' -and $journal) { $env:BYTETAP_TEST_JOURNAL = $journal }
            $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
            $null = $p.Handle
            $ready = $false
            for ($i = 0; $i -lt 40 -and -not $ready; $i++) {
              Start-Sleep -Milliseconds 250
              $ready = (Test-Path $log) -and (Select-String -Path $log -Pattern 'интерфейс готов' -Quiet -Encoding utf8)
            }
            # Запись: сообщения в ленту, иначе экран записи пуст.
            if ($env:BYTETAP_TEST_AUTOSTART) {
              $found = $null
              for ($i = 0; $i -lt 40 -and -not $found; $i++) {
                if (Test-Path $log) {
                  $found = Select-String -Path $log -Pattern 'запись идёт: адрес ([^,\s]+), журнал (.+)$' -Encoding utf8 | Select-Object -First 1
                }
                if (-not $found) { Start-Sleep -Milliseconds 250 }
              }
              if ($found) {
                $addr = $found.Matches[0].Groups[1].Value
                $recorded = $found.Matches[0].Groups[2].Value.Trim()
                if (-not $journal -and $recorded -and (Test-Path $recorded)) { $journal = $recorded }
                try {
                  $port = [int]($addr -split ':')[-1]
                  $client = New-Object System.Net.Sockets.TcpClient
                  $client.Connect('127.0.0.1', $port)
                  $stream = $client.GetStream()
                  $stream.ReadTimeout = 500
                  $buffer = New-Object byte[] 4096
                  $messages = @(
                    "MSH|^~\&|ANALYZER|LAB|LIS||20261019232710||ORU^R01|MSG0002|P|2.3.1`rPID|1||000001||PATIENT^TEST`rOBX|1|NM|GLU^Glucose||5.4|mmol/L`r",
                    "MSH|^~\&|ANALYZER|LAB|LIS||20261019232710||ORU^R01|MSG0003|P|2.3.1`rPID|1||000001||PATIENT^TEST`rOBX|1|NM|GLU^Glucose||5.1|mmol/L`r",
                    "MSH|^~\&|ANALYZER|LAB|LIS||20261019232710||ORU^R01|MSG0006|P|2.3.1`rQRD|20261019|R|I|MSG0002|||10^RD`r",
                    "MSH|^~\&|ANALYZER|LAB|LIS||20261019232710||ORU^R01|MSG0007|P|2.3.1`rPID|1||000001||PATIENT^TEST`r"
                  )
                  foreach ($text in $messages) {
                    [byte[]]$frame = @(0x0b) + [System.Text.Encoding]::ASCII.GetBytes($text) + @(0x1c, 0x0d)
                    $stream.Write($frame, 0, $frame.Length)
                    try { $null = $stream.Read($buffer, 0, $buffer.Length) } catch { }
                    Start-Sleep -Milliseconds 200
                  }
                  $client.Close()
                } catch { Write-Host "${name}: клиент HL7: $_" }
              }
            }
            if (-not $p.HasExited) {
              try {
                Start-Sleep -Milliseconds 700
                $p.Refresh()
                $hwnd = $p.MainWindowHandle
                [void][Shot]::SetForegroundWindow($hwnd)
                [void][Shot]::SetWindowPos($hwnd, [IntPtr]::Zero, 8, 8, $w, $h, 0x14)
                Start-Sleep -Milliseconds 900
                $rect = New-Object Shot+RECT
                [void][Shot]::DwmGetWindowAttribute($hwnd, 9, [ref]$rect, [System.Runtime.InteropServices.Marshal]::SizeOf($rect))
                $width = $rect.Right - $rect.Left
                $height = $rect.Bottom - $rect.Top
                $bmp = New-Object System.Drawing.Bitmap $width, $height
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                $g.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bmp.Size)
                $file = Join-Path $out ('{0:d2}-{1}.png' -f $index, $name)
                $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
                $g.Dispose(); $bmp.Dispose()
                Write-Host "${name}: ${width}x${height} → $file"
              } catch { Write-Host "${name}: снимок: $_"; $failed = $true }
              Stop-Process -Id $p.Id -Force
            } else {
              Write-Host "${name}: bytetap.exe завершился, код $($p.HasExited)"
              $failed = $true
            }
            Start-Sleep -Milliseconds 300
          }
          $env:BYTETAP_TEST_HOOKS = ''
          $env:BYTETAP_TEST_SCREEN = ''
          $env:BYTETAP_TEST_JOURNAL = ''
          # Эталон 1200×800 в точках: снимки egui_kittest (100, 125 и 150 %).
          $reference = New-Item -ItemType Directory -Force -Path review/kittest
          Copy-Item crates/bytetap-app/tests/snapshots/*.png $reference
          if ($failed) { exit 1 }


      # U1-AC21: экраны в обеих темах из настоящего exe и эталоны egui_kittest 1200×800.
      - name: Снимки для согласования
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bytetap-native-review-shots
          path: review/
          if-no-files-found: warn

      # exe релиза — без feature `test-hooks`: размер, DLL, иконка и версия проверяются
      # на нём — на том же exe, что собирает `release.yml` для владельца. Сборка идёт
      # последней, после смоука: в артефакте `bytetap-native-windows-x64` лежит ровно
      # релизный exe. Зависимости — из того же кеша (`Swatinem/rust-cache`).
      - name: cargo build --release (exe релиза, без хуков)
        run: cargo build --release -p bytetap-app --bin bytetap

      # Смоук того же exe, что уходит в релиз. Хуков в нём нет, поэтому проверяется
      # только то, что работает без них: окно открывается (процесс жив через 15 с) и
      # журнал запуска доходит до «интерфейс готов» — с аппаратным адаптером и с WARP,
      # где заодно сверяется выбранный адаптер (U1-AC2). До этого шага окно в CI
      # проверялось только на хуковой сборке, а релизный exe не запускался вовсе.
      - name: Смоук — запуск exe релиза
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path smoke
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          $failed = $false
          foreach ($run in @(@{ Name = 'release-default'; Adapter = '' }, @{ Name = 'release-warp'; Adapter = 'basic render' })) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $env:WGPU_ADAPTER_NAME = $run.Adapter
            $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
            $null = $p.Handle
            Start-Sleep -Seconds 15
            $alive = -not $p.HasExited
            if ($alive) {
              Write-Host "$($run.Name): процесс жив через 15 с"
              Stop-Process -Id $p.Id -Force
            } else {
              Write-Host "$($run.Name): bytetap.exe завершился, код $($p.ExitCode)"
            }
            if (Test-Path $log) {
              Copy-Item $log (Join-Path $out "bytetap-$($run.Name).log")
              Get-Content -Encoding utf8 $log
            } else { Write-Host "журнала $log нет" }
            $ready = (Test-Path $log) -and (Select-String -Path $log -Pattern 'интерфейс готов' -Quiet -Encoding utf8)
            if (-not $alive -or -not $ready) { $failed = $true }
            if ($run.Name -eq 'release-warp' -and -not (Select-String -Path $log -Pattern 'выбран адаптер wgpu: Microsoft Basic Render Driver' -Quiet -Encoding utf8)) {
              Write-Host 'WARP не выбран'
              $failed = $true
            }
            Start-Sleep -Seconds 1
          }
          $env:WGPU_ADAPTER_NAME = ''
          if ($failed) { exit 1 }

      - name: Размер и DLL exe
        shell: pwsh
        run: |
          $exe = Get-Item target\release\bytetap.exe
          Write-Host ("bytetap.exe: {0:N2} МБ ({1} байт)" -f ($exe.Length / 1MB), $exe.Length)
          if ($exe.Length -gt 25MB) { throw 'bytetap.exe больше 25 МБ (NFR-7)' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents $exe.FullName
          $deps | Write-Host
          # Белый список по факту: каждая DLL должна лежать в System32 (наборы API
          # api-ms-win-* Windows разрешает сама, файлов у них может не быть).
          $dlls = foreach ($line in $deps) { if ($line -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } }
          if (-not $dlls) { throw 'dumpbin не показал ни одной DLL' }
          $system32 = Join-Path $env:SystemRoot 'System32'
          $extra = $dlls | Where-Object { $_ -notmatch '^api-ms-win-' -and -not (Test-Path (Join-Path $system32 $_)) }
          if ($extra) { throw "exe зависит от DLL не из System32: $($extra -join ', ')" }

      # U1-AC1 (NFR-7): у exe есть иконка приложения и VERSIONINFO из ресурса.
      #
      # Ресурс (`crates/bytetap-app/assets/bytetap.rc`) собирает `build.rs` для Windows
      # MSVC: свойства файла — ProductName, версия из `CARGO_PKG_VERSION`, без CompanyName,
      # — читает `FileVersionInfo`, иконку — `ExtractAssociatedIcon`. Иконку сверяем с
      # `assets/icon.ico` (иконка проекта из v0.1.0, MIT): у exe без ресурса
      # `ExtractAssociatedIcon` отдаёт стандартную иконку приложения, и пиксели с ней не
      # совпадут.
      - name: Иконка и версия exe
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Get-Item target\release\bytetap.exe).FullName
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "в корневом Cargo.toml не найдена версия [workspace.package]" }
          $version = $match.Matches[0].Groups[1].Value
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          Write-Host "exe: ProductName '$($info.ProductName)', версия '$($info.ProductVersion)', файл '$($info.FileVersion)'"
          if ($info.ProductName -ne 'bytetap') { throw "ProductName exe: '$($info.ProductName)'" }
          if (-not ($info.ProductVersion -eq $version -or $info.ProductVersion -eq "$version.0")) {
            throw "ProductVersion exe '$($info.ProductVersion)' не $version"
          }
          if ($info.CompanyName) { throw "CompanyName в свойствах exe: '$($info.CompanyName)'" }

          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'у exe нет иконки' }
          $stream = [System.IO.File]::OpenRead((Resolve-Path 'crates\bytetap-app\assets\icon.ico'))
          $expected = New-Object System.Drawing.Icon($stream, 32, 32)
          $got = $icon.ToBitmap()
          $want = $expected.ToBitmap()
          $stream.Dispose()
          if ($got.Width -ne $want.Width -or $got.Height -ne $want.Height) {
            # Размер иконки выбирает оболочка; сверяем картинку в её размере.
            $scaled = New-Object System.Drawing.Bitmap $got.Width, $got.Height
            $g = [System.Drawing.Graphics]::FromImage($scaled)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($want, 0, 0, $got.Width, $got.Height)
            $g.Dispose()
            $want = $scaled
          }
          $different = 0
          for ($y = 0; $y -lt $got.Height; $y++) {
            for ($x = 0; $x -lt $got.Width; $x++) {
              if ($got.GetPixel($x, $y).ToArgb() -ne $want.GetPixel($x, $y).ToArgb()) { $different++ }
            }
          }
          $total = $got.Width * $got.Height
          Write-Host "иконка exe $($got.Width)x$($got.Height): расхождений с assets/icon.ico $different из $total"
          if ($different -gt [int]($total * 0.2)) { throw 'иконка exe не совпадает с иконкой проекта (стандартная иконка?)' }

      # Тестовых хуков (`BYTETAP_TEST_HOOKS`, `BYTETAP_TEST_AUTOSTART`, `BYTETAP_TEST_PANIC`,
      # `BYTETAP_TEST_SCREEN`, `BYTETAP_TEST_JOURNAL`, `BYTETAP_TEST_PROBE*`) в exe релиза
      # нет: все они за feature `test-hooks`. Проверка по байтам — тот же шаг, что в
      # `release.yml`, на том же exe. Байты декодируются один к одному (ISO-8859-1):
      # в UTF-16 ASCII-строка не нашлась бы и проверка зеленела бы молча. Поиск —
      # ordinal, без учёта культуры. Положительный контроль: строка, которая в exe
      # есть всегда (`gpu::RETRY_ENV`, метка перезапуска с WARP), — не нашлась, значит
      # сломан сам поиск.
      - name: В exe нет тестовых хуков
        shell: pwsh
        run: |
          $path = (Resolve-Path 'target\release\bytetap.exe').Path
          $text = [System.Text.Encoding]::GetEncoding(28591).GetString([System.IO.File]::ReadAllBytes($path))
          function Count-Ordinal([string] $haystack, [string] $needle) {
            $count = 0
            $index = $haystack.IndexOf($needle, [StringComparison]::Ordinal)
            while ($index -ge 0) {
              $count++
              $index = $haystack.IndexOf($needle, $index + 1, [StringComparison]::Ordinal)
            }
            return $count
          }
          $control = 'BYTETAP_WARP_RETRY'
          $controlCount = Count-Ordinal $text $control
          Write-Host "положительный контроль '$control' в bytetap.exe: $controlCount"
          if ($controlCount -eq 0) { throw "поиск по байтам не работает: '$control' в bytetap.exe не найдена" }
          $prefix = 'BYTETAP_TEST'
          $count = Count-Ordinal $text $prefix
          Write-Host "вхождений '$prefix' в bytetap.exe: $count"
          if ($count -gt 0) { throw 'в exe есть строки тестовых хуков — хуки попали в релиз' }

      # Снимки и журналы всех смоуков, включая запуски exe релиза выше. Шаг с `always()`:
      # журналы нужны и тогда, когда смоук упал.
      - name: Снимки и журналы смоука
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bytetap-native-smoke
          path: smoke/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bytetap-native-windows-x64
          path: |
            target/release/bytetap.exe
            THIRD-PARTY-LICENSES.md
          if-no-files-found: error
  # U1-AC24 (NFR-5): цена кадра на WARP. Раскладка и тесселяция кадра 1200×800 стоят
  # 0.13–0.30 мс (`cargo test --test performance frame_cost_probe`), а живой кадр —
  # сотни миллисекунд, поэтому цена кадра меряется в живом окне: проба
  # (`BYTETAP_TEST_PROBE`, см. crates/bytetap-app/src/probe.rs) просит перерисовку
  # каждый кадр и пишет в журнал запуска промежуток между кадрами, время отрисовки и
  # ожидание GPU. Варианты с ключами BYTETAP_TEST_PROBE_* показывают, из чего цена
  # складывается: режим представления, MSAA, задержка кадров, размер окна, иконки.
  # Только по ручному запуску: `gh workflow run CI --ref native-ui -f probe=1`.
  native-probe:
    name: native-probe
    if: github.event_name == 'workflow_dispatch' && inputs.probe
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.2
        with:
          shared-key: native-windows

      - name: cargo build --release (смоук, feature test-hooks)
        run: cargo build --release -p bytetap-app --bin bytetap --features test-hooks

      - name: Проба цены кадра
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          $keys = @(
            'BYTETAP_TEST_AUTOSTART', 'BYTETAP_TEST_HOOKS', 'BYTETAP_TEST_PROBE',
            'BYTETAP_TEST_PROBE_MODE', 'BYTETAP_TEST_PROBE_PRESENT',
            'BYTETAP_TEST_PROBE_MSAA', 'BYTETAP_TEST_PROBE_LATENCY',
            'BYTETAP_TEST_PROBE_SIZE', 'BYTETAP_TEST_PROBE_PERIOD',
            'BYTETAP_TEST_PROBE_POLL', 'WGPU_ADAPTER_NAME', 'WGPU_BACKEND'
          )
          # Цена кадра не зависит от периода его запроса — так это или нет, видно по
          # CPU: он либо падает вместе с числом кадров, либо остаётся.
          $variants = @(
            @{ Name = 'непрерывно'; Env = @{} },
            @{ Name = 'непрерывно, без ожидания GPU'; Env = @{ BYTETAP_TEST_PROBE_POLL = '0' } },
            @{ Name = 'период 100 мс'; Env = @{ BYTETAP_TEST_PROBE_PERIOD = '100'; BYTETAP_TEST_PROBE_POLL = '0' } },
            @{ Name = 'период 100 мс, ожидание GPU'; Env = @{ BYTETAP_TEST_PROBE_PERIOD = '100' } },
            @{ Name = 'период 33 мс'; Env = @{ BYTETAP_TEST_PROBE_PERIOD = '33'; BYTETAP_TEST_PROBE_POLL = '0' } },
            @{ Name = 'период 33 мс, ожидание GPU'; Env = @{ BYTETAP_TEST_PROBE_PERIOD = '33' } },
            @{ Name = 'запись, непрерывно'; Env = @{ BYTETAP_TEST_AUTOSTART = 'tcp_server:127.0.0.1:0' } },
            @{ Name = 'запись, период 100 мс'; Env = @{ BYTETAP_TEST_AUTOSTART = 'tcp_server:127.0.0.1:0'; BYTETAP_TEST_PROBE_PERIOD = '100'; BYTETAP_TEST_PROBE_POLL = '0' } },
            @{ Name = 'запись, период 33 мс'; Env = @{ BYTETAP_TEST_AUTOSTART = 'tcp_server:127.0.0.1:0'; BYTETAP_TEST_PROBE_PERIOD = '33'; BYTETAP_TEST_PROBE_POLL = '0' } },
            @{ Name = 'только фон, период 100 мс'; Env = @{ BYTETAP_TEST_PROBE_MODE = 'empty'; BYTETAP_TEST_PROBE_PERIOD = '100'; BYTETAP_TEST_PROBE_POLL = '0' } },
            @{ Name = 'период 100 мс, immediate'; Env = @{ BYTETAP_TEST_PROBE_PERIOD = '100'; BYTETAP_TEST_PROBE_POLL = '0'; BYTETAP_TEST_PROBE_PRESENT = 'immediate' } }
          )
          $rows = @('| вариант | итог пробы | CPU % одного ядра |', '| --- | --- | --- |')
          $failed = $false
          foreach ($variant in $variants) {
            foreach ($key in $keys) { Remove-Item "env:$key" -ErrorAction SilentlyContinue }
            $env:BYTETAP_TEST_HOOKS = '1'
            $env:BYTETAP_TEST_PROBE = '14'
            $env:WGPU_ADAPTER_NAME = 'basic render'
            foreach ($key in $variant.Env.Keys) { Set-Item "env:$key" $variant.Env[$key] }
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
            $null = $p.Handle
            Write-Host "=== $($variant.Name) ==="
            # Запись: адрес из журнала запуска, затем поток 100 фрагментов HL7 в секунду.
            $sender = $null
            if ($variant.Name -like 'запись*') {
              $addr = $null
              for ($i = 0; $i -lt 40 -and -not $addr; $i++) {
                Start-Sleep -Milliseconds 250
                if (Test-Path $log) {
                  $found = Select-String -Path $log -Pattern 'запись идёт: адрес ([^,\s]+)' -Encoding utf8 | Select-Object -First 1
                  if ($found) { $addr = $found.Matches[0].Groups[1].Value }
                }
              }
              if (-not $addr) { Write-Host 'запись не началась' } else {
                $port = [int]($addr -split ':')[-1]
                Write-Host "запись: $addr"
                $sender = Start-Job -ScriptBlock {
                  param($port)
                  $client = New-Object System.Net.Sockets.TcpClient
                  $client.Connect('127.0.0.1', $port)
                  $stream = $client.GetStream()
                  $stream.ReadTimeout = 500
                  $buffer = New-Object byte[] 4096
                  for ($i = 0; $i -lt 200; $i++) {
                    $text = "MSH|^~\&|ANALYZER|LAB|LIS||20261019101500||ORU^R01|MSG$i|P|2.3.1`rPID|1||000001||PATIENT^TEST`rOBX|1|NM|GLU^Glucose||5.4|mmol/L`r"
                    [byte[]]$frame = @(0x0b) + [System.Text.Encoding]::ASCII.GetBytes($text) + @(0x1c, 0x0d)
                    try { $stream.Write($frame, 0, $frame.Length) } catch { break }
                    try { $null = $stream.Read($buffer, 0, $buffer.Length) } catch { }
                    Start-Sleep -Milliseconds 100
                  }
                  $client.Close()
                } -ArgumentList $port
              }
            }
            Start-Sleep -Seconds 2
            $p.Refresh()
            if ($p.HasExited) {
              Write-Host "процесс завершился, код $($p.ExitCode)"
              $rows += "| $($variant.Name) | процесс завершился, код $($p.ExitCode) | |"
              $failed = $true
              continue
            }
            $t0 = $p.TotalProcessorTime.TotalSeconds
            Start-Sleep -Seconds 6
            $p.Refresh()
            $cpu = ($p.TotalProcessorTime.TotalSeconds - $t0) / 6 * 100
            # Проба завершает процесс сама; сторож — на случай окна ошибки.
            if (-not $p.WaitForExit(25000)) {
              Write-Host 'процесс не завершился за 25 с'
              Stop-Process -Id $p.Id -Force
            }
            if ($sender) { Stop-Job $sender -ErrorAction SilentlyContinue; Remove-Job $sender -Force -ErrorAction SilentlyContinue }
            $header = ''
            $total = ''
            $seconds = @()
            if (Test-Path $log) {
              $found = Select-String -Path $log -Pattern 'проба кадра: адаптер' -Encoding utf8 | Select-Object -First 1
              if ($found) { $header = $found.Line }
              $seconds = @(Select-String -Path $log -Pattern 'проба кадра: \d+\.\d+ с, кадров' -Encoding utf8 | ForEach-Object { $_.Line })
              $found = Select-String -Path $log -Pattern 'проба кадра: итог' -Encoding utf8 | Select-Object -Last 1
              if ($found) { $total = $found.Line }
            }
            if ($header) { Write-Host $header }
            foreach ($line in $seconds) { Write-Host $line }
            if ($total) { Write-Host $total } else { Write-Host 'итога пробы в журнале нет'; $failed = $true }
            Write-Host ('CPU за 6 с: {0:N1} % одного ядра' -f $cpu)
            $rows += "| $($variant.Name) | $total | $('{0:N1}' -f $cpu) |"
            Start-Sleep -Seconds 1
          }
          foreach ($key in $keys) { Remove-Item "env:$key" -ErrorAction SilentlyContinue }
          $rows | Write-Host
          $rows | Out-File -Encoding utf8 smoke-probe.txt

          # OpenGL (только для сравнения): на Windows без драйвера видео это GDI 1.1
          # поверх программного растра.
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:BYTETAP_TEST_HOOKS = '1'
          $env:BYTETAP_TEST_PROBE = '6'
          $env:WGPU_BACKEND = 'gl'
          $env:WGPU_ADAPTER_NAME = ''
          $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(25000)) { Stop-Process -Id $p.Id -Force; Write-Host 'OpenGL: процесс не завершился за 25 с' }
          foreach ($key in $keys) { Remove-Item "env:$key" -ErrorAction SilentlyContinue }
          Write-Host '=== OpenGL ==='
          if (Test-Path $log) { Get-Content -Encoding utf8 $log }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bytetap-native-probe
          path: smoke-probe.txt
          if-no-files-found: warn

  # U1-AC24 (NFR-5): память долгой записи. Ручной прогон настоящего release-exe:
  # запись на loopback с потоком фрагментов, раз в минуту снимаются WorkingSet и
  # PrivateBytes процесса. Буфер ленты ограничен 10 000 фрагментов (U1-AC13), поэтому
  # после прогрева память не должна расти: критерий — рост не больше 10 %.
  # Только по ручному запуску: `gh workflow run CI --ref native-ui -f soak=1`.
  native-soak:
    name: native-soak
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.2
        with:
          shared-key: native-windows

      - name: cargo build --release (смоук, feature test-hooks)
        run: cargo build --release -p bytetap-app --bin bytetap --features test-hooks

      - name: Запись потоком и замер памяти
        shell: pwsh
        env:
          MINUTES: ${{ inputs.soak-minutes }}
          RATE: ${{ inputs.soak-rate }}
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:LOCALAPPDATA 'io.github.fgbm.bytetap\logs\bytetap.log'
          $minutes = [int]$env:MINUTES
          $rate = [int]$env:RATE
          # Длительность и таймаут job согласованы: сборка, прогрев и минутный запас
          # потока укладываются в timeout-minutes: 60 только до 40 минут записи.
          if ($minutes -lt 4 -or $minutes -gt 40) { throw "soak-minutes: от 4 до 40 минут, а не $minutes" }
          if ($rate -lt 1) { throw "soak-rate: фрагментов в секунду больше нуля, а не $rate" }
          $out = New-Item -ItemType Directory -Force -Path soak
          Write-Host "длительность записи: $minutes мин, поток $rate фрагментов/с"

          Remove-Item $log -ErrorAction SilentlyContinue
          $env:BYTETAP_TEST_HOOKS = '1'
          $env:BYTETAP_TEST_AUTOSTART = 'tcp_server:127.0.0.1:0'
          $p = Start-Process -FilePath 'target\release\bytetap.exe' -PassThru
          $null = $p.Handle
          $env:BYTETAP_TEST_AUTOSTART = ''
          $env:BYTETAP_TEST_HOOKS = ''

          $addr = $null
          $journal = $null
          for ($i = 0; $i -lt 120 -and -not $addr; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $log) {
              $found = Select-String -Path $log -Pattern 'запись идёт: адрес ([^,\s]+), журнал (.+)$' -Encoding utf8 | Select-Object -First 1
              if ($found) {
                $addr = $found.Matches[0].Groups[1].Value
                $journal = $found.Matches[0].Groups[2].Value.Trim()
              }
            }
          }
          if (-not $addr) { throw 'запись не началась: в журнале запуска нет адреса' }
          Write-Host "адрес записи: $addr, журнал: $journal"

          # Поток в отдельном процессе PowerShell: фрагменты пачками по rate/10 раз в
          # 100 мс. Живёт на минуту дольше замера, чтобы последняя точка снималась при
          # идущем обмене.
          $port = [int]($addr -split ':')[-1]
          $sender = Start-Job -ScriptBlock {
            param($port, $rate, $seconds)
            $client = New-Object System.Net.Sockets.TcpClient
            $client.Connect('127.0.0.1', $port)
            $stream = $client.GetStream()
            $stream.ReadTimeout = 200
            $buffer = New-Object byte[] 8192
            $batch = [Math]::Max(1, [int]($rate / 10))
            $frame = 0
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              for ($i = 0; $i -lt $batch; $i++) {
                $text = "MSH|^~\&|ANALYZER|LAB|LIS||20261019101500||ORU^R01|MSG$frame|P|2.3.1`rPID|1||000001||PATIENT^TEST`rOBX|1|NM|GLU^Glucose||5.4|mmol/L`r"
                [byte[]]$bytes = @(0x0b) + [System.Text.Encoding]::ASCII.GetBytes($text) + @(0x1c, 0x0d)
                try { $stream.Write($bytes, 0, $bytes.Length) } catch { $client.Close(); return }
                $frame++
              }
              # Автоответы: читаем, чтобы буфер сокета не переполнился.
              try { $null = $stream.Read($buffer, 0, $buffer.Length) } catch { }
              Start-Sleep -Milliseconds 100
            }
            $client.Close()
            Write-Output "отправлено фрагментов: $frame"
          } -ArgumentList $port, $rate, ($minutes * 60 + 60)

          # Прогрев входит в кривую: за первые минуты приложение занимает память под
          # кеши шрифтов и растра, и критерий считается по участку после него. Меньший
          # прогрев ловил разовый рост на 6–7-й минуте как «утечку». Прогрев — 10 минут,
          # а на коротком прогоне — половина записи: иначе сравнивать было бы нечего.
          $warmup = [Math]::Min(10, [Math]::Max(1, [int][Math]::Floor($minutes / 2)))
          $rows = @('| минута | WorkingSet, МБ | PrivateBytes, МБ | журнал, МБ |', '| --- | --- | --- | --- |')
          $ws = @()
          $pv = @()
          for ($m = 1; $m -le $minutes; $m++) {
            Start-Sleep -Seconds 60
            if ($p.HasExited) { throw "bytetap.exe завершился на $m-й минуте" }
            $p.Refresh()
            $w = $p.WorkingSet64 / 1MB
            $v = $p.PrivateMemorySize64 / 1MB
            $size = if ($journal -and (Test-Path $journal)) { (Get-Item $journal).Length / 1MB } else { 0 }
            $ws += $w
            $pv += $v
            $rows += "| $m | {0:N1} | {1:N1} | {2:N1} |" -f $w, $v, $size
            Write-Host ("{0} мин: WorkingSet {1:N1} МБ, PrivateBytes {2:N1} МБ, журнал {3:N1} МБ" -f $m, $w, $v, $size)
          }

          # Остановка штатная (WM_CLOSE): журнал получает session_end, а журнал запуска
          # — итог кадров записи.
          $null = $p.CloseMainWindow()
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force }
          # Поток гасим отдельно: `Receive-Job -Id` принимает номер, а не задание.
          $sent = $null
          try { $sent = Receive-Job -Job $sender -Wait -AutoRemoveJob } catch { Write-Host "поток: $_" }

          $ready = [Math]::Min($warmup, $ws.Count - 1)
          $baseWs = ($ws[0..$ready] | Measure-Object -Maximum).Maximum
          $basePv = ($pv[0..$ready] | Measure-Object -Maximum).Maximum
          $peakWs = ($ws[($ready + 1)..($ws.Count - 1)] | Measure-Object -Maximum).Maximum
          $peakPv = ($pv[($ready + 1)..($pv.Count - 1)] | Measure-Object -Maximum).Maximum
          $endWs = $ws[-1]
          $endPv = $pv[-1]
          $growthWs = ($peakWs - $baseWs) / $baseWs * 100
          $growthPv = ($peakPv - $basePv) / $basePv * 100
          $line = "после прогрева ({0} мин): WorkingSet {1:N1} → {2:N1} МБ (пик {3:N1}), рост {4:N1} %; PrivateBytes {5:N1} → {6:N1} МБ (пик {7:N1}), рост {8:N1} %" -f $warmup, $baseWs, $endWs, $peakWs, $growthWs, $basePv, $endPv, $peakPv, $growthPv
          Write-Host $line
          # Таблица пишется до проверок: если прогон упадёт, её всё равно видно в артефакте.
          $rows += ''
          $rows += $line
          if ($sent) { $rows += $sent }
          $rows | Out-File -Encoding utf8 soak/memory.txt

          $failed = $false
          if ($growthWs -gt 10) { Write-Host "WorkingSet вырос на $growthWs % — больше 10 %"; $failed = $true }
          if ($growthPv -gt 10) { Write-Host "PrivateBytes вырос на $growthPv % — больше 10 %"; $failed = $true }
          if (Test-Path $log) {
            $tail = Select-String -Path $log -Pattern 'кадров за запись|цена кадра записи|пропущено' -Encoding utf8
            $tail | ForEach-Object { $_.Line } | Out-File -Encoding utf8 soak/memory-app-log.txt
          }
          if ($failed) { exit 1 }

      - name: Замер памяти
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bytetap-soak-memory
          path: soak/
          if-no-files-found: warn

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Установить actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Проверить workflow
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Проверить workflow и dependabot на уязвимости
        run: pipx run zizmor==1.31.1 --min-severity medium .github
