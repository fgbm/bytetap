name: Release

# Релиз v0.2.0 — нативный bytetap.exe (crates/bytetap-app): Tauri и npm для сборки
# больше не нужны. По тегу `v*` собирается exe, zip и SHA256SUMS, затем создаётся
# черновик релиза. Ручной запуск собирает те же артефакты и ничего не публикует:
# так workflow проверяется на ветке до тега (`gh workflow run Release --ref native-ui`).
on:
  push:
    tags:
      - "v*"
  # Ручной запуск — только сборка: тега нет, и job `publish` в нём не идёт. Входов
  # поэтому нет: любое значение входа пришлось бы либо игнорировать, либо проверять.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V

      # Кеша нет намеренно: релиз собирается редко и публикует артефакты, а кеш cargo
      # в публикующем workflow — путь подмены артефакта (zizmor: cache-poisoning).
      # `--locked`: релиз собирается ровно по `Cargo.lock` из тега, без обновления
      # зависимостей на сборочной машине.
      - name: cargo build --release
        run: cargo build --release --locked -p bytetap-app --bin bytetap

      # NFR-7 и U1-AC1: exe релиза — тот же, что в CI (`native-windows`), поэтому те же
      # проверки перед упаковкой: размер и зависимости только из System32.
      - name: Размер и DLL exe
        shell: pwsh
        run: |
          $exe = Get-Item target\release\bytetap.exe
          Write-Host ("bytetap.exe: {0:N2} МБ ({1} байт)" -f ($exe.Length / 1MB), $exe.Length)
          if ($exe.Length -gt 25MB) { throw 'bytetap.exe больше 25 МБ (NFR-7)' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents $exe.FullName
          $deps | Write-Host
          $dlls = foreach ($line in $deps) { if ($line -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } }
          if (-not $dlls) { throw 'dumpbin не показал ни одной DLL' }
          $system32 = Join-Path $env:SystemRoot 'System32'
          $extra = $dlls | Where-Object { $_ -notmatch '^api-ms-win-' -and -not (Test-Path (Join-Path $system32 $_)) }
          if ($extra) { throw "exe зависит от DLL не из System32: $($extra -join ', ')" }

      # U1-AC1 (NFR-7): у exe есть иконка приложения и VERSIONINFO из ресурса. Ресурс
      # (`crates/bytetap-app/assets/bytetap.rc`) собирает `build.rs`, и в релизе он
      # обязателен: проверка та же, что в CI (`native-windows`), — без неё в свойствах
      # файла и на панели задач оказался бы exe без иконки и версии.
      - name: Иконка и версия exe
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Get-Item target\release\bytetap.exe).FullName
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "в корневом Cargo.toml не найдена версия [workspace.package]" }
          $version = $match.Matches[0].Groups[1].Value
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          Write-Host "exe: ProductName '$($info.ProductName)', версия '$($info.ProductVersion)', файл '$($info.FileVersion)'"
          if ($info.ProductName -ne 'bytetap') { throw "ProductName exe: '$($info.ProductName)'" }
          if (-not ($info.ProductVersion -eq $version -or $info.ProductVersion -eq "$version.0")) {
            throw "ProductVersion exe '$($info.ProductVersion)' не $version"
          }
          if ($info.CompanyName) { throw "CompanyName в свойствах exe: '$($info.CompanyName)'" }

          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'у exe нет иконки' }
          $stream = [System.IO.File]::OpenRead((Resolve-Path 'crates\bytetap-app\assets\icon.ico'))
          $expected = New-Object System.Drawing.Icon($stream, 32, 32)
          $got = $icon.ToBitmap()
          $want = $expected.ToBitmap()
          $stream.Dispose()
          if ($got.Width -ne $want.Width -or $got.Height -ne $want.Height) {
            # Размер иконки выбирает оболочка; сверяем картинку в её размере.
            $scaled = New-Object System.Drawing.Bitmap $got.Width, $got.Height
            $g = [System.Drawing.Graphics]::FromImage($scaled)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($want, 0, 0, $got.Width, $got.Height)
            $g.Dispose()
            $want = $scaled
          }
          $different = 0
          for ($y = 0; $y -lt $got.Height; $y++) {
            for ($x = 0; $x -lt $got.Width; $x++) {
              if ($got.GetPixel($x, $y).ToArgb() -ne $want.GetPixel($x, $y).ToArgb()) { $different++ }
            }
          }
          $total = $got.Width * $got.Height
          Write-Host "иконка exe $($got.Width)x$($got.Height): расхождений с assets/icon.ico $different из $total"
          if ($different -gt [int]($total * 0.2)) { throw 'иконка exe не совпадает с иконкой проекта (стандартная иконка?)' }

      # Тестовые хуки (`BYTETAP_TEST_HOOKS`, `BYTETAP_TEST_AUTOSTART`, `BYTETAP_TEST_PROBE*`)
      # в релизный exe не компилируются: они за feature `test-hooks` (`Cargo.toml`), и
      # `cargo build --release` её не включает. Проверка по байтам: бинарник читается
      # один к одному (ISO-8859-1) и в нём не должно быть ни одного ключа хуков —
      # все они начинаются с `BYTETAP_TEST`.
      - name: В exe нет тестовых хуков
        shell: pwsh
        run: |
          $path = (Resolve-Path 'target\release\bytetap.exe').Path
          $text = [System.Text.Encoding]::GetEncoding(28591).GetString([System.IO.File]::ReadAllBytes($path))
          $found = @{}
          foreach ($pattern in @('BYTETAP_TEST', 'BYTETAP_TEST_HOOKS')) {
            $count = 0
            $index = $text.IndexOf($pattern)
            while ($index -ge 0) {
              $count++
              $index = $text.IndexOf($pattern, $index + 1)
            }
            $found[$pattern] = $count
            Write-Host "вхождений '$pattern' в bytetap.exe: $count"
          }
          if ($found['BYTETAP_TEST'] -gt 0 -or $found['BYTETAP_TEST_HOOKS'] -gt 0) {
            throw 'в exe есть строки тестовых хуков — хуки попали в релиз'
          }

      # Лицензии встроенных шрифтов, иконок и сторонних crate едут в архиве рядом с exe.
      - name: Сторонние лицензии актуальны
        run: node scripts/licenses.mjs --check

      - name: Сверить тег с версией
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "в корневом Cargo.toml не найден [workspace.package] version" }
          $expected = "v" + $match.Matches[0].Groups[1].Value
          if ($env:TAG -ne $expected) { throw "тег $env:TAG не совпадает с версией $expected" }

      # Имя архива ручного запуска — по версии из Cargo.toml: у ветки тега нет, а
      # артефакт должен называться так же, как в релизе.
      - name: zip и SHA256SUMS
        shell: pwsh
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          $tag = $env:TAG
          if (-not $tag) {
            $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
            if (-not $match) { throw "в корневом Cargo.toml не найден [workspace.package] version" }
            $tag = "v" + $match.Matches[0].Groups[1].Value
          }
          $name = "bytetap-$tag-windows-x64"
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item target/release/bytetap.exe staging/
          Copy-Item README.md, LICENSE, THIRD-PARTY-LICENSES.md staging/
          Compress-Archive -Path staging/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath SHA256SUMS -Encoding ascii
          Get-ChildItem staging | Select-Object Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bytetap-release
          path: |
            bytetap-*.zip
            SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    # Черновик релиза — только по тегу, то есть только на push. Ручной запуск
    # (`workflow_dispatch`) публиковать нечего: тега нет, и проверка сборки остаётся
    # проверкой, даже если запущена с `--ref` тега.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bytetap-release
          path: dist

      - name: Сверить контрольную сумму
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Черновик релиза
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" --draft --verify-tag --generate-notes --title "bytetap $TAG" dist/bytetap-*.zip dist/SHA256SUMS
