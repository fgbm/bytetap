# Обновления зависимостей (Dependabot).
#
# Патчи и минорные версии приходят одной группой раз в неделю, мажорные — отдельными
# pull request'ами: их разбирают руками. Действия в workflow закреплены по SHA,
# Dependabot обновляет сам SHA и комментарий с версией.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Мажор typescript ставят руками: override в корневом package.json держит
    # ^6.0.3, иначе Dependabot падает на «Override for typescript conflicts with
    # direct dependency».
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
