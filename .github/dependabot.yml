# Обновления зависимостей (Dependabot).
#
# Патчи и минорные версии приходят одной группой раз в неделю, мажорные — отдельными
# pull request'ами: их разбирают руками. Действия в workflow закреплены по SHA,
# Dependabot обновляет сам SHA и комментарий с версией.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
